set -g mouse on
set-option -g prefix C-a
unbind-key C-b
setw -g mode-keys vi
set -g set-clipboard on
# Let tmux pick the shell from SHELL/getpwuid instead of pinning /bin/zsh.

set -gq allow-passthrough on

# -- copy-mode mapping -------------------------------------------------------------------

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'H' send -X start-of-line
bind-key -T copy-mode-vi 'L' send -X end-of-line

bind-key -T copy-mode-vi DoubleClick1Pane select-pane\; send-keys -X select-word
bind-key -T copy-mode-vi TripleClick1Pane select-pane\; send-keys -X select-line

# disable "release mouse drag to copy and exit copy-mode", ref: https://github.com/tmux/tmux/issues/140
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# since MouseDragEnd1Pane neither exit copy-mode nor clear selection now,
# let single click do selection clearing for us.
bind-key -T copy-mode-vi MouseDown1Pane select-pane\; send-keys -X clear-selection

# -- Bind config --------------------------------------------------------------
# bind b list-buffers     # list paste buffers
bind ] paste-buffer -p  # paste from the top paste buffer
bind b choose-buffer    # choose which buffer to paste from
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one
# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# toggle status bar visibility
bind-key : set-option -g status

# create window
bind-key n next-window
bind-key c new-window

# break off pane to a new window
bind-key u \
  command-prompt -p 'break-pane:' -I '#W' \
    'break-pane ; rename-window "%%%"'
bind-key U break-pane

# focus window
bind-key P previous-window
bind-key N next-window

# focus by number
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
bind-key 0 choose-window
bind-key 1 select-window -t :1
bind-key 2 select-window -t :2
bind-key 3 select-window -t :3
bind-key 4 select-window -t :4
bind-key 5 select-window -t :5
bind-key 6 select-window -t :6
bind-key 7 select-window -t :7
bind-key 8 select-window -t :8
bind-key 9 select-window -t :1 \; select-window -t :-1

# create pane (below, above, left, right)
bind-key - split-window -c '#{pane_current_path}'
# bind-key A split-window -c '#{pane_current_path}' -b
# bind-key O split-window -c '#{pane_current_path}' -b -h
bind-key \\ split-window -c '#{pane_current_path}'    -h
bind-key "'" last-window

# select-pane
# bind-key h select-pane -L
# bind-key l select-pane -R
# bind-key j select-pane -D
# bind-key k select-pane -U
bind-key o last-pane
bind-key z display-panes
bind-key w choose-window -Z
set -g display-panes-time 2000

# zoom pane
bind-key p resize-pane -Z

# monitor window
set-option -g visual-activity on
set-option -g visual-silence on

bind-key R source ~/.tmux.conf \; display-message 'config reloaded!'
bind-key r command-prompt -I '#W' 'rename-window "%%"'

# set C-a q open/close popup window
bind-key -N 'Toggle popup window' q if-shell -F '#{==:#{session_name},popup}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 90% -h 95% -E 'tmux attach-session -t popup || tmux new-session -s popup'
}


# -- special config for quitting qemu
bind-key -T prefix x send-keys C-a x

# search buffer using copy mode
bind-key / copy-mode \;\
  command-prompt -p 'search-backward (press up):' \
    -i 'send-keys -X search-backward-incremental "%%%"'

# search colored buffer using less
bind-key ?                           \
  capture-pane -e -J -S - \;              \
  new-window -n '#S:#I.#P' -a 'sh -c "tmux save-buffer - | less -R; tmux delete-buffer"' \; \
  run-shell 'tmux send-keys G \?'

bind-key -T copy-mode-vi / command-prompt -p 'search-backward:' -I '#{pane_search_string}' -i 'send-keys -X search-backward-incremental "%%%"'
bind-key -T copy-mode-vi ? command-prompt -p 'search-forward:' -I '#{pane_search_string}' -i 'send-keys -X search-forward-incremental "%%%"'


# 将 C-a h 绑定到：在popup窗口中直接打开fzf的man页面

# bind-key -N 'Toggle popup window' h if-shell -F '#{==:#{session_name},popup}' {
#     detach-client
# } {
#     send-keys -t popup "q" C-m Escape l "man -k . | fzf | awk '{print \$1}' | xargs man" C-m 
#     display-popup -d "#{pane_current_path}" -xC -yC -w 90% -h 85% -E 'tmux attach-session -t popup || tmux new-session -s popup'
