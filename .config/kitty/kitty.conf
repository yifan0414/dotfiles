################## font ###########################
# BEGIN_KITTY_FONTS
# Font ligatures settings for Jet Brains Mono Font:
# https://github.com/JetBrains/JetBrainsMono/wiki/OpenType-features
# font_family      family='Fira Code' style=Medium          features=' +ss02 +cv04 +cv16 +cv18 +cv19 +cv20'
# bold_font        family='Fira Code' style=Medium          features=' +ss02 +cv04 +cv16 +cv18 +cv19 +cv20'
# italic_font      family='Fira Code' style='Medium Italic' features=' +ss02 +cv04 +cv16 +cv18 +cv19 +cv20'
# bold_italic_font family='Fira Code' style='Bold Italic'   features=' +ss02 +cv04 +cv16 +cv18 +cv19 +cv20'

font_family      family='Maple Mono CN' style=Medium          features='+cv03'
bold_font        family='Maple Mono CN' style=Bold            features='+cv03'
italic_font      family='Maple Mono CN' style='Medium Italic' features='+cv03'
bold_italic_font family='Maple Mono CN' style='Bold Italic'   features='+cv03'
disable_ligatures never
font_size         14
# cursor_trail 1

################## cursor #########################
# cursor #575279
# cursor #e6e0c2
# cursor none
cursor_blink_interval 0
cursor_shape block
# cursor_text_color

##################  ui    #########################

# tab_bar_style hidden
modify_font underline_position 2
modify_font underline_thickness 150%

# Reverse-video selection: selected background follows the text color.
selection_foreground none
selection_background none

modify_font cell_height 110%
# modify_font cell_height 90%
# modify_font baseline 1

# 窗口边距边距
# single_window_margin_width 0
# window_margin_width 1 1
# window_padding_width 0 1 
# macOS titlebar color is overridden after the theme include so it tracks the
# active window background even when themes are switched with set_colors.
# macos_titlebar_color system
# hide_window_decorations titlebar-only
#
macos_show_window_title_in none

confirm_os_window_close 0
scrollback_lines 20000

################## command blocks ###############

# Keep prompt/output boundaries explicit so command-block actions work
# consistently with zsh, Powerlevel10k, and kitty's OSC 133 integration.
shell_integration enabled no-cursor

##################  map   #########################

# enabled_layouts tall:bias=50;
# enabled_layouts tall:bias=70;full_size=2
# enabled_layouts tall

macos_option_as_alt yes

# map alt+n next_tab
# map alt+c new_tab
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+enter combine : goto_layout splits : launch --location=hsplit --cwd=current
map cmd+shift+enter combine : goto_layout splits : launch --location=vsplit --cwd=current
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map ctrl+cmd+, load_config_file
# map alt+z toggle_layout stack

# map ctrl+left neighboring_window left
# map ctrl+right neighboring_window right
# map ctrl+down neighboring_window down
# map ctrl+up neighboring_window up




# map ctrl+j kitten pass_keys.py neighboring_window bottom ctrl+j
# map ctrl+k kitten pass_keys.py neighboring_window top    ctrl+k
# map ctrl+h kitten pass_keys.py neighboring_window left   ctrl+h
# map ctrl+l kitten pass_keys.py neighboring_window right  ctrl+l



allow_remote_control yes
listen_on unix:/tmp/kitty

# Keep the titlebar synced with the active window background. This must come
# after the included theme because those files set a fixed macos_titlebar_color.
# macos_titlebar_color background

# Disable link underline highlighting; keep links clickable.
url_style none
underline_hyperlinks never
