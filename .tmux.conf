# -- set config ---------------------------------------------------------------
# set -g default-terminal "screen-256color"
# set -ga terminal-overrides ",*256col*:Tc"

set -g default-terminal "tmux-256color"

# report modified keys (Shift/Ctrl/Alt+Enter etc.) to applications
set -g extended-keys on
set -g extended-keys-format csi-u

# 为 macOS 配置
if-shell "uname | grep Darwin" {
  set -sa terminal-features ',xterm-kitty:RGB,cstyle'
}

# 为 Linux 配置
if-shell "uname | grep Linux" {
  set -sa terminal-overrides ',xterm-256color:RGB'
}

# set -sa terminal-features ',tmux-256color:RGB'
# set -sa terminal-features ',xterm-kitty:RGB' # mac config
# set -sa terminal-overrides ',xterm-256color:RGB'

set -g popup-border-lines rounded

# Theme colors follow macOS appearance and default to light on Linux.
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-left-length 32
set -g status-right-length 64
set-hook -g client-attached 'run-shell "~/.tmux/scripts/sync-appearance.sh"'
set-hook -g session-created 'run-shell "~/.tmux/scripts/sync-appearance.sh"'
bind-key T run-shell "~/.tmux/scripts/sync-appearance.sh" \; display-message 'theme synced'

# allow Vim to recieve modifier keys: Shift, Control, Alt
set-window-option -g xterm-keys on

# -- copy the text in tmux ----------------------------------------------------
set -g @yank_with_mouse off
set -g @yank_action 'copy-pipe' # or 'copy-pipe-and-cancel' for the default

# -- cancel the character ---------------------------------------------
# prevent tmux from catching modifier keys meant for Vim
# (set > 0: https://github.com/microsoft/WSL/issues/5931)
set -sg escape-time 1

#Enable oh my zsh in tmux
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# set -g @plugin 'sunaku/tmux-navigate'
# set -g @navigate-back  '\'
# set -g @navigate-left  'h'
# set -g @navigate-up    'k'
# set -g @navigate-down  'j'
# set -g @navigate-right 'l'

set -g @plugin 'christoomey/vim-tmux-navigator'
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
# 设置鼠标滚动速度
# 设置鼠标滚动大小

set -g @scroll-speed-num-lines-per-scroll 1
# set -g @emulate-scroll-for-no-mouse-alternate-buffer on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)

run '~/.tmux/plugins/tpm/tpm'
run-shell '~/.tmux/scripts/sync-appearance.sh'
